<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cima Becco | Cime, sentieri e itinerari trekking</title>
    <meta
      name="description"
      content="Montagne, cime, sentieri e trekking in Italia. Scopri e pianifica i tuoi percorsi sulla mappa."
    />
    <!-- Canonical address and link previews. %VITE_SITE_URL% is the public
         address (vite.config.ts; the deploy sets it from public/CNAME). -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Cima Becco" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Cima Becco" />
    <meta property="og:description" content="Scopri, pianifica e condividi itinerari sulle montagne italiane." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cima Becco",
        "url": "%VITE_SITE_URL%/",
        "description": "Atlante delle montagne italiane: esplora le cime, scopri i sentieri e pianifica i tuoi itinerari trekking con GPX.",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT"
      }
    </script>
    <!-- Absolute paths: Vite prefixes them with `base` (e.g. /HillGPX/) at build. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Figtree, the closest free face to Airbnb Cereal. Preconnect so the
         font request does not wait on DNS and TLS before it starts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Bitter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Plain text for crawlers that do not run JavaScript (most AI bots).
         React replaces it as soon as the app starts. -->
    <div id="root"><main><h1>Cima Becco — Atlante delle montagne italiane</h1><p>Scopri le cime, pianifica trekking e consulta gli itinerari in Italia e nelle aree alpine confinanti.</p><p><a href="#map">Esplora la mappa</a> · <a href="#routes">Percorsi</a> · <a href="#pianifica">Pianifica</a></p></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
