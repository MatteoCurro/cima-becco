name: Import CAI and OSM refuges release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-cai-refuges-v1.yml
      - scripts/assemble_refuges_release_v1.py
      - src/lib/alpinePlaces.ts
      - src/lib/refugeRelease.ts
      - src/components/AlpineAtlasPage.tsx
      - scripts/import_cai_refuges_v1.py
      - scripts/publish_refuges_v1.py
      - tests/test_assemble_refuges_release_v1.py
      - tests/test_import_cai_refuges_v1.py
      - tests/test_publish_refuges_v1.py
      - scripts/assemble_shelters_release_v1.py
      - tests/test_assemble_shelters_release_v1.py
      - src/lib/shelterRelease.ts
      - src/lib/shelterRelease.test.ts
      - scripts/merge_shelters_for_seo.mjs
      - scripts/build_source_credits.mjs
      - scripts/build_seo.mjs
      - scripts/import_metrics_v1.mjs
      - src/components/AtlasDossierBlocks.tsx
      - src/components/InfoPage.tsx
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: cima-refuges-cai-release
  cancel-in-progress: true

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test acquisizione e dataset pubblico
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_import_cai_refuges_v1.py' -v
          python -m unittest discover -s tests -p 'test_publish_refuges_v1.py' -v
          python -m unittest discover -s tests -p 'test_assemble_refuges_release_v1.py' -v
          python -m unittest discover -s tests -p 'test_assemble_shelters_release_v1.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verifica preventiva TypeScript e test prima delle API CAI
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test
      - name: Normalizza i rifugi dello snapshot OSM
        run: python scripts/import_refuges_v1.py --strict
      - name: Aggiorna il catalogo CAI completo solo per i record modificati
        run: python scripts/import_cai_refuges_v1.py --workers 5
      - name: Unisci rifugi CAI e OSM senza confondere i bivacchi
        run: python scripts/assemble_refuges_release_v1.py
      - name: Materializza bivacchi, capanne sociali e ricoveri tipizzati
        run: python scripts/assemble_shelters_release_v1.py
      - name: Quality gate strutturale e report
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json; from pathlib import Path; p=Path('public/data/atlas/refuges-v1.json'); d=json.loads(p.read_text()); e=d['entities']; assert d['schemaVersion']=='1.1'; assert len(e)>=400; assert len(set(x['id'] for x in e))==len(e); assert len(set(x['slug'] for x in e))==len(e); assert all(x['kind']=='refuge' for x in e); print('Refuges validated:',len(e))"
          python -c "import json; from pathlib import Path; d=json.loads(Path('public/data/atlas/shelters-v1.json').read_text()); e=d['entities']; assert d['schemaVersion']=='2.0'; assert len(e)>=370; assert len(e)==len(set(x['id'] for x in e)); assert len(e)==len(set(x['slug'] for x in e)); assert all(x['kind'] in ('bivouac','shelter') for x in e); assert all(not x['safety']['openingConfirmed'] and not x['safety']['waterPotabilityConfirmed'] for x in e); print('Shelters validated:',len(e))"
      - name: Preserva per QA il catalogo CAI gia acquisito
        uses: actions/upload-artifact@v4
        with:
          name: cima-refuges-normalized-cai-cache
          path: |
            public/data/atlas/cai-refuges-v1.json
            public/data/atlas/refuges-v1.json
            public/data/atlas/shelters-v1.json
          retention-days: 5
      - name: Build e regressioni frontend/SEO su dati CAI reali
        shell: bash
        env:
          VITE_BASE: /
          SITE_URL: https://www.cimabecco.it
          VITE_SITE_URL: https://www.cimabecco.it
        run: |
          set -euo pipefail
          npm run build
          node scripts/check_permalinks.mjs
          node scripts/test_central_credits.mjs
          test -s dist/data/atlas/refuges-v1.json
          test -s dist/data/atlas/shelters-v1.json
          test -s dist/data/atlas/credits-v1.json
          test -s dist/fonti-e-crediti/index.html
      - name: Archivia report senza artefatti non richiesti
        uses: actions/upload-artifact@v4
        with:
          name: cima-refuges-release-report
          path: |
            build/release-refuges-v1/report.json
            build/release-refuges-v1/match-review.json
            build/import-shelters-v1/report.json
            build/import-shelters-v1/identity-review.json
          retention-days: 21
      - name: Registra riuscita import CAI e ricoveri nello storico per pipeline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/import_metrics_v1.mjs rifugi-ricoveri "$GITHUB_RUN_ID" build/release-refuges-v1/report.json
      - name: Versiona soltanto i due JSON pubblici dopo i controlli
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/atlas/cai-refuges-v1.json public/data/atlas/refuges-v1.json public/data/atlas/shelters-v1.json public/data/atlas/import-history-rifugi-ricoveri-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "data(atlas): refresh CAI refuges, bivouacs and support shelters"
            # Other files may have been edited in this PR during the slow CAI run.
            # Incorporate those commits rather than force-pushing or losing data.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Nessuna modifica dei dati; niente nuovo commit.'
          fi
