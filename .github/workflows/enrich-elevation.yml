name: Enrich trail elevation

on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_elevation.py
      - .github/workflows/enrich-elevation.yml
      - tests/test_enrich_elevation.py
  schedule:
    - cron: '12 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cima-becco-elevation
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Libreria PNG e verifiche
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -m unittest discover -s tests -p 'test_enrich_elevation.py' -v
      - name: Calcola dislivelli con DEM Terrarium
        run: python scripts/enrich_elevation.py --write --max-routes 180
      - name: Pubblica quote e checkpoint
        run: |
          if [ -z "$(git status --porcelain -- public/data/routes-tiles/ public/data/elevation-status.json)" ]; then
            echo "Nessuna nuova quota disponibile"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/data/routes-tiles/ public/data/elevation-status.json
          git commit -m "data: dislivelli DEM stimati per nuovi percorsi"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
