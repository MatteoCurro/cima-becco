name: Patch audited dependencies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dependency-audit.yml'

permissions:
  contents: write

concurrency:
  group: cima-becco-patch-dependencies
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Apply non-breaking security updates (no --force)
        run: npm audit fix --ignore-scripts --no-fund
      - name: Verify fully clean audit, including development tools
        run: npm audit --audit-level=moderate
      - name: Verify reproducible lockfile
        run: npm ci
      - name: TypeScript and unit tests
        run: |
          npm run typecheck
          npm run test
      - name: Build site and SEO pages
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://www.cimabecco.it
          SITE_URL: https://www.cimabecco.it
        run: npm run build
      - name: Commit reviewed dependency updates, preserving concurrent importer changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): apply compatible patched dependency versions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
