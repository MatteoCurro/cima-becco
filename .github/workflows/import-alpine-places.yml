name: Import alpine huts and towns
on:
  push:
    branches: [main]
    paths:
      - scripts/import_alpine_places.py
      - tests/test_alpine_places.py
      - .github/workflows/import-alpine-places.yml
  schedule:
    - cron: '27 4 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cimabecco-atlas-osm
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test di associazione geometrica
        run: python -m unittest discover -s tests -p 'test_alpine_places.py' -v
      - name: Scarica i POI Dolomiti e associa ai sentieri
        run: python scripts/import_alpine_places.py --write
      - name: Registra nuovi POI e collegamenti
        run: |
          if [ -z "$(git status --porcelain -- public/data/alpine-places.json public/data/routes-tiles/)" ]; then
            echo "Nessun cambiamento POI"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/data/alpine-places.json public/data/routes-tiles/
          git commit -m "data: rifugi e borghi dalle Dolomiti, tappe verificate per i GPX"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
