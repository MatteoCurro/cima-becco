name: Import alpine places and stage rural candidates
on:
  push:
    branches: [main]
    paths:
      - scripts/import_alpine_places.py
      - public/data/atlas/alpine-structure-evidence-v1.json
      - scripts/import_alpine_water.py
      - tests/test_alpine_water.py
      - tests/test_alpine_places.py
      - .github/workflows/import-alpine-places.yml
  schedule:
    - cron: '27 4,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cima-alpine-data-writers
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Allinea il catalogo ai file più recenti prima dell'import
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Test di associazione geometrica
        run: python -m unittest discover -s tests -p 'test_alpine_places.py' -v
      - name: Scarica i POI Dolomiti e associa ai sentieri
        run: python scripts/import_alpine_places.py --write
      - name: Test e aggiornamento punti acqua
        run: |
          python -m unittest discover -s tests -p 'test_alpine_water.py' -v
          python scripts/import_alpine_water.py --write
      - name: Registra nuovi POI e collegamenti
        run: |
          if [ -z "$(git status --porcelain -- public/data/alpine-places.json public/data/alpine-water.json public/data/alpine-import-progress.json public/data/routes-tiles/ public/data/atlas/rural-classification-candidates-v1.json)" ]; then
            echo "Nessun cambiamento POI"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/data/alpine-places.json public/data/alpine-water.json public/data/alpine-import-progress.json public/data/routes-tiles/ public/data/atlas/rural-classification-candidates-v1.json
          git commit -m "data: rifugi e borghi dalle Dolomiti, tappe verificate per i GPX"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { echo "Conflitto sui dati: import non pubblicato, nessuna sovrascrittura"; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            echo "Push concorrente, riprovo ($attempt/4)"
            sleep 7
          done
          echo 'Impossibile pubblicare dati senza sovrascrivere altri commit' >&2
          exit 1
