name: Import OSM routes

on:
  push:
    branches: [main]
    paths:
      - scripts/import_osm_routes.py
      - scripts/harvest_routes.py
      - .github/workflows/import-osm-routes.yml
      - tests/test_import_osm_routes.py
      - tests/test_harvest_routes.py
  schedule:
    # Due batch da massimo due celle al giorno, fuori dagli orari di punta.
    - cron: '17 3 * * *'
    - cron: '47 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-osm-routes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline di integrità geometrie e orchestrazione
        run: python -m unittest discover -s tests -p 'test_*routes.py' -v
      - name: Acquisisci un lotto geografico da OSM
        run: python scripts/harvest_routes.py --write --batch-size 2 --pause-seconds 15
      - name: Registra nuove geometrie verificate
        run: |
          if [ -z "$(git status --porcelain -- public/data/routes-tiles/ public/data/routes-manifest.json public/data/import-status.json)" ]; then
            echo "Nessuna modifica ai sentieri"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Include anche il caso della prima cella vuota: la cartella shard può non esistere.
          git add -A public/data/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: aggiorna progressivamente il catalogo OSM"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
