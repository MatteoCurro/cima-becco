name: Import OSM routes

on:
  push:
    branches: [main]
    paths:
      - scripts/import_osm_routes.py
      - .github/workflows/import-osm-routes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-osm-routes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importa sentieri dolomitici da OSM
        run: python scripts/import_osm_routes.py --write --max-routes 80
      - name: Registra nuove geometrie verificate
        run: |
          if git diff --quiet -- public/data/routes.json; then
            echo "Nessuna modifica ai sentieri"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/routes.json
          git commit -m "data: importa sentieri OSM Dolomiti (pilota)"
          git push
