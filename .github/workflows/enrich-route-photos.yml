name: Enrich route photos

on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_route_photos.py
      - tests/test_enrich_route_photos.py
      - .github/workflows/enrich-route-photos.yml
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cima-becco-route-photos
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica corrispondenza e attribuzioni delle foto
        run: python -m unittest discover -s tests -p 'test_enrich_route_photos.py' -v
      - name: Arricchimento Wikimedia Commons prudente
        run: python scripts/enrich_route_photos.py --write --max-routes 12
      - name: Registra foto e checkpoint
        run: |
          if [ -z "$(git status --porcelain -- public/data/route-photo-status.json public/data/routes-tiles/)" ]; then
            echo "Nessun aggiornamento foto"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/data/routes-tiles/ public/data/route-photo-status.json
          git commit -m "data: foto Commons verificate e stato arricchimento"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
