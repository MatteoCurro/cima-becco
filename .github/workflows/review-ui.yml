name: Validate UI and alpine data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/CNAME'
      - 'vite.config.ts'
      - '.github/workflows/deploy.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'public/data/alpine-places.json'
      - '.github/workflows/review-ui.yml'
  push:
    branches:
      - main
      - 'refactor/unified-mountain-experience'
permissions:
  contents: read
jobs:
  verify:
    # Playwright --with-deps non è ancora compatibile coi pacchetti Ubuntu 26.04 del runner latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Python importer and photo matching regression tests
        run: |
          python -m unittest discover -s tests -p 'test_alpine_places.py' -v
          python -m unittest discover -s tests -p 'test_enrich_alpine_photos.py' -v
      - name: CSS layout integrity (real source files)
        run: node scripts/check_css_layout.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Vite and static SEO build
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://www.cimabecco.it
          SITE_URL: https://www.cimabecco.it
        run: npm run build

      - name: Check territorial home snapshot
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('dist/data/home-editorial-v1.json','utf8')); if(!x.territories?.length) throw Error('Home editoriale priva di territori'); console.log('Territori:',x.territories.length,'categorie:',Object.fromEntries(Object.entries(x.discovery).map(([k,v])=>[k,v.length])));"
      - name: Keep a compact editorial home preview for QA
        uses: actions/upload-artifact@v4
        with:
          name: home-editorial-preview
          path: dist/data/home-editorial-v1.json
          retention-days: 7
      - name: Check deep link SEO pages boot into React
        run: node scripts/check_permalinks.mjs
      - name: Install headless Chromium for responsive review
        run: npx playwright install --with-deps chromium webkit
      - name: Validate layout in real browser (desktop and mobile)
        run: npx playwright test tests/ui-layout.spec.ts tests/home-navigation.spec.ts --project=chromium --project=webkit
      - name: Keep screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-failure
          path: test-results/
          retention-days: 7
