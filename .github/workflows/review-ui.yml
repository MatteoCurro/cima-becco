name: Validate UI and alpine data
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/CNAME'
      - 'vite.config.ts'
      - '.github/workflows/deploy.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'public/data/alpine-places.json'
      - '.github/workflows/review-ui.yml'
  push:
    branches:
      - 'refactor/unified-mountain-experience'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Python importer and photo matching regression tests
        run: |
          python -m unittest discover -s tests -p 'test_alpine_places.py' -v
          python -m unittest discover -s tests -p 'test_enrich_alpine_photos.py' -v
      - name: CSS layout integrity (real source files)
        run: node scripts/check_css_layout.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Vite and static SEO build
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://www.cimabecco.it
          SITE_URL: https://www.cimabecco.it
        run: npm run build

      - name: Check deep link SEO pages boot into React
        run: node scripts/check_permalinks.mjs
      - name: Install headless Chromium for responsive review
        run: npx playwright install --with-deps chromium
      - name: Validate layout in real browser (desktop and mobile)
        run: npx playwright test tests/ui-layout.spec.ts --project=chromium
