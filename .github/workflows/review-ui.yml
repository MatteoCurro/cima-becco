name: Validate UI and alpine data
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/data/alpine-places.json'
      - '.github/workflows/review-ui.yml'
  push:
    branches:
      - 'refactor/unified-mountain-experience'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Python importer and photo matching regression tests
        run: |
          python -m unittest discover -s tests -p 'test_alpine_places.py' -v
          python -m unittest discover -s tests -p 'test_enrich_alpine_photos.py' -v
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Vite and static SEO build
        env:
          VITE_BASE: /cima-becco/
          VITE_SITE_URL: https://matteocurro.github.io/cima-becco
          SITE_URL: https://matteocurro.github.io/cima-becco
        run: npm run build
